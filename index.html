    // Sound chime helper using Web Audio API
    function playOrderChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.12); // A5
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch (e) {
        console.warn("Audio not permitted yet:", e);
      }
    }

      const showToast = (msg) => {

      // Voice recognition setup
      const handleVoiceSearch = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          // Fallback simulation for live demo
          const samplePhrases = ["Tata Tea", "Atta", "Amul Butter", "Milk"];
          const picked = samplePhrases[Math.floor(Math.random() * samplePhrases.length)];
          setSearchQuery(picked);
          showToast(`🎤 Voice recognized: "${picked}"`);
          return;
        }

        try {
          const recognition = new SpeechRecognition();
          recognition.lang = language === 'hi' ? 'hi-IN' : language === 'kn' ? 'kn-IN' : 'en-IN';
          recognition.interimResults = false;
          setIsListening(true);

          recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            setSearchQuery(transcript);
            setIsListening(false);
            showToast(`🎤 Heard: "${transcript}"`);
          };

          recognition.onerror = () => {
            setIsListening(false);
            // Graceful demo fallback
            setSearchQuery("Amul Butter");
            showToast("🎤 Fallback demo speech: 'Amul Butter'");
          };

          recognition.onend = () => setIsListening(false);
          recognition.start();
        } catch (err) {
          setIsListening(false);
          setSearchQuery("Aashirvaad Atta");
          showToast("🎤 Voice Search triggered: 'Aashirvaad Atta'");
        }
      };

      // Cart actions
      const addToCart = (product, shop) => {
        setCart(prev => {
          const existing = prev.find(item => item.product.id === product.id);
          if (existing) {
            return prev.map(item => item.product.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { product, shop, qty: 1 }];
        });
        showToast(`🛒 Added ${product.title} to cart!`);
      };

      const updateCartQty = (productId, delta) => {
        setCart(prev => prev.map(item => {
          if (item.product.id === productId) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const cartTotal = useMemo(() => {
        return cart.reduce((sum, item) => sum + (item.product.price * item.qty), 0);

        if (cart.length === 0) return;
        
        const newOrderId = `ORD-${Math.floor(1000 + Math.random() * 9000)}`;
        const primaryShopId = cart[0].shop.id;

          shopId: primaryShopId,
          items: cart.map(item => ({ title: item.product.title, qty: item.qty, price: item.product.price })),

          paymentMode: "UPI Instant (Paid)",
          status: "PENDING",
          createdAt: "Just now"
        };

        // Decrement stock in active inventory
        setProducts(prev => prev.map(p => {
          const orderedItem = cart.find(c => c.product.id === p.id);
          if (orderedItem) {
            const updatedStock = Math.max(0, p.stock - orderedItem.qty);
            return { ...p, stock: updatedStock };
          }
          return p;

        playOrderChime();
        showToast(`🎉 Order #${newOrderId} confirmed! UPI Payment Successful.`);

        showToast(`Order ${orderId} moved to: ${nextStatus}`);
      };

      // Inline Stock Modifier in Seller Portal
      const handleUpdateStock = (productId, delta) => {
        setProducts(prev => prev.map(p => {
          if (p.id === productId) {
            const nextStock = Math.max(0, p.stock + delta);
            return { ...p, stock: nextStock };

            </div>
          )}

          {/* --- FLOATING TOAST NOTIFICATION --- */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2 border border-slate-800 animate-bounce">
              <span>🔔</span>
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    // Render the React application
    ReactDOM.createRoot(document.getElementById('root')).render(<BazaarApp />);
  </script>
</body>
</html>
